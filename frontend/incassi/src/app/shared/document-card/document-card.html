<button type="button" class="flex w-33 shrink-0 snap-start flex-col gap-1.5 text-left">
  <div class="aspect-3/4 w-full">
    <app-document-thumbnail [tipo]="documento().tipo" />
  </div>
  <span class="truncate text-sm leading-tight font-semibold text-surface-900 dark:text-surface-0">
    {{ documento().nome }}
  </span>
  <span class="text-xs text-surface-500 dark:text-surface-400">
    {{ documento().data | date: 'd MMM y' }}
  </span>
</button>
