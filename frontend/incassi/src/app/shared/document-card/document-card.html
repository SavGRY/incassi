<div class="flex w-33 shrink-0 snap-start flex-col gap-1.5">
  <div class="aspect-3/4 w-full">
    <app-document-thumbnail [mediaId]="document().id" [tipo]="document().type_of_media" />
  </div>
  <div class="flex items-start gap-1">
    <div class="flex min-w-0 flex-1 flex-col gap-1.5">
      <span class="truncate text-sm leading-tight font-semibold dark:text-white">
        {{ document().type_of_media === 'scan' ? 'Riepilogo A4' : 'Busta' }} #{{ document().incasso_id }}
      </span>
      <span class="text-xs text-surface-500 dark:text-surface-400">
        {{ document().creation_date | date: 'd MMM y' }}
      </span>
    </div>
    <p-button
      icon="fa fa-regular fa-download"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      ariaLabel="Scarica il documento"
      (onClick)="onDownload()" />
  </div>
</div>
