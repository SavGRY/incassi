<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
  <div class="flex flex-col gap-2 h-fit">
    <label for="incasso-cliente" class="text-sm font-medium leading-normal">Cliente</label>
    <p-autoComplete
      inputId="incasso-cliente"
      formControlName="cliente"
      [suggestions]="suggerimenti()"
      (completeMethod)="cercaClienti($event)"
      optionLabel="ragioneSociale"
      placeholder="Cerca per ragione sociale o codice"
      class="w-full"
      [inputStyleClass]="'w-full'" />
  </div>

  <div class="flex flex-col gap-2">
    <label for="incasso-importo" class="text-sm font-medium leading-normal">Importo</label>
    <input
      pInputText
      id="incasso-importo"
      type="number"
      step="0.01"
      formControlName="importo"
      placeholder="€ 0,00"
      class="w-full rounded-lg px-3 py-2 shadow-sm" />
  </div>

  <div class="flex flex-col gap-2">
    <span class="text-sm font-medium leading-normal">Tipo di pagamento</span>
    <p-selectbutton [options]="tipiPagamento" formControlName="tipoPagamento" optionLabel="label" optionValue="value" />
  </div>

  <button
    type="submit"
    pButton
    [disabled]="!isFormValid()"
    [class]="!isFormValid() ? '!cursor-not-allowed' : ''"
    class="w-full justify-center rounded-lg py-2">
    <span pButtonLabel>Salva incasso</span>
  </button>
</form>
