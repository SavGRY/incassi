<form [formGroup]='form' (ngSubmit)='onSubmit()' class='flex flex-col gap-5'>
  <div class='flex flex-col gap-2 h-fit'>
    <label for='incasso-cliente' class='text-sm font-medium leading-normal'>Cliente</label>
    <p-autoComplete
      inputId='incasso-cliente'
      formControlName='cliente'
      [suggestions]='autocomplete()'
      (completeMethod)='searchClients($event)'
      optionLabel="name"
      optionValue='name'
      placeholder='Cerca per ragione sociale o codice'
      class='w-full'
      [inputStyleClass]="'w-full'">
      <ng-template #header>
        <div class='font-bold px-4 py-2 flex w-full gap-2'>
          <p class='m-0 w-1/4'>Codice</p>
          <p class='m-0 w-3/4'> Ragione Sociale</p>
        </div>
        <hr>
      </ng-template>
      <ng-template let-client #item>
        <div class='flex w-full gap-2'>
          <div class='w-1/4'>
            {{ client.code }}
          </div>
          <div class='w-3/4'>
            {{ client.name }}
          </div>
        </div>
      </ng-template>
    </p-autoComplete>
  </div>

  <div class='flex flex-col gap-2'>
    <label for='incasso-importo' class='text-sm font-medium leading-normal'>Importo</label>
    <input
      pInputText
      id='incasso-importo'
      type='number'
      step='0.01'
      formControlName='importo'
      placeholder='€ 0,00'
      class='w-full rounded-lg px-3 py-2 shadow-sm' />
  </div>
  <div class='flex items-center gap-2'>

    <div class='flex flex-col gap-2 grow-1'>
      <span class='text-sm font-medium leading-normal'>Tipo di pagamento</span>
      <p-selectbutton [options]='paymentType' formControlName='tipoPagamento' optionLabel='label' optionValue='value' />
    </div>

    <div class='flex flex-col gap-2'>
      <span class='text-sm font-medium leading-normal'>Carica immagine</span>
      <div class='flex flex-row justify-around items-center gap-2'>
        <p-fileupload
          mode='basic'
          accept='image/*'
          chooseIcon='fa fa-regular fa-images'
          [chooseStyleClass]="uploadedImage() ? '1' : 'p-button-icon-only'"
          [chooseLabel]="uploadedImage() ? '1' : '0'"
          uploadIcon='fa fa-regular fa-images'
          invalidFileTypeMessageSummary='{0}: tipo di file non valido.'
          invalidFileTypeMessageDetail="Seleziona un'immagine."
          invalidFileSizeMessageSummary='{0}: file troppo grande.'
          invalidFileSizeMessageDetail="La dimensione massima e' {0}."
          [maxFileSize]='10 * 1024 * 1024'
          [customUpload]='true'
          [chooseButtonProps]='sceltaImmagineProps'
          (onSelect)='onSelectedFile($event)'>
          <ng-template #filelabel></ng-template>
        </p-fileupload>
        <p-button
          icon='fa fa-regular fa-camera'
          ariaLabel='Scatta una foto'
          [rounded]='true' />
      </div>
    </div>
  </div>

  <button
    type='submit'
    pButton
    [disabled]='!isFormValid()'
    [class]="!isFormValid() ? '!cursor-not-allowed' : ''"
    class='w-full justify-center rounded-lg py-2'>
    <span pButtonLabel>Salva incasso</span>
  </button>
</form>
