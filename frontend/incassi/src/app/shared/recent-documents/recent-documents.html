<section class="flex flex-col gap-3">
  <div class="flex items-baseline justify-between">
    <h2 class="text-lg font-semibold dark:text-white">Ultimi incassi creati</h2>
    <p-button label="Mostra tutto" [text]="true" size="small" routerLink="/documenti" />
  </div>

  <div class="relative">
    <p-button
      icon="fa"
      class="absolute top-1/2 -left-2 z-10 -translate-y-1/2"
      [outlined]="true"
      [rounded]="true"
      size="small"
      ariaLabel="Documenti precedenti"
      [class]="'fa-chevron-left'"
      (onClick)="scorriIndietro()" />

    <div #carousel class="flex snap-x snap-mandatory gap-3.5 overflow-x-auto scroll-smooth px-1 pb-1">
      @for (documento of documenti(); track documento.id) {
        <app-document-card [documento]="documento" />
      }
    </div>

    <p-button
      icon="fa"
      class="absolute top-1/2 -right-2 z-10 -translate-y-1/2"
      [outlined]="true"
      [rounded]="true"
      size="small"
      ariaLabel="Documenti successivi"
      [class]="'fa-chevron-right'"
      (onClick)="scorriAvanti()" />
  </div>
</section>
