<div
  class="flex w-full items-center gap-3 border-b border-surface-200 py-3 text-left last:border-b-0 dark:border-surface-700">
  <div class="h-12 w-9 shrink-0">
    <app-document-thumbnail [mediaId]="document().id" [tipo]="document().type_of_media" [showBadge]="false" />
  </div>
  <div class="min-w-0 flex-1">
    <div class="truncate text-sm font-semibold dark:text-surface-0">
      {{ document().type_of_media === 'scan' ? 'Riepilogo A4' : 'Busta' }} #{{ document().incasso_id }}
    </div>
    <div class="truncate text-xs text-surface-500 dark:text-surface-400">
      {{ document().creation_date | date: 'd MMM y' }} &middot; {{ document().payments_count }}
      {{ document().payments_count === 1 ? 'incasso' : 'incassi' }} &middot; {{ document().total | currency }}
    </div>
  </div>
  <p-tag
    [value]="tag().label"
    [severity]="tag().severity" />
  <p-button
    icon="fa fa-regular fa-download"
    [rounded]="true"
    [text]="true"
    severity="secondary"
    ariaLabel="Scarica il documento"
    (onClick)="onDownload()" />
</div>
