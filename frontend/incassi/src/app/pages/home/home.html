<div class="container mx-auto flex flex-col gap-7 pb-28">
  <app-recent-documents [documents]="documents" />
</div>

<app-create-toggler
  (createIncasso)="isIncassoDrawerOpen.set(true)"
  (createCliente)="isClienteDrawerOpen.set(true)" />

<p-drawer [(visible)]="isIncassoDrawerOpen" position="bottom" header="Nuovo incasso" styleClass="h-fit!">
  <!-- A template, not projected content: the drawer builds the form when it
       opens and destroys it when it closes, with its scanner check. -->
  <ng-template #content>
    <app-incasso-form (submitIncassi)="onSubmitIncassi($event)" (emitGetClient)="onGetClient()" />
  </ng-template>
</p-drawer>

<p-drawer [(visible)]="isClienteDrawerOpen" position="bottom" header="Nuovo cliente" styleClass="h-fit!">
  @if (erroreCliente()) {
    <p role="alert" class="mb-4 rounded-lg px-3 py-2 text-sm text-red-700 dark:text-red-300">
      {{ erroreCliente() }}
    </p>
  }
  <app-cliente-form (saveNewClient)="onSaveClient($event)" />
</p-drawer>
