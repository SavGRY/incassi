<div class="flex flex-col gap-4">
  <div class="flex items-center gap-3">
    <button
      type="button"
      pButton
      [text]="true"
      [rounded]="true"
      routerLink="/"
      class="h-9! w-9! justify-center p-0!"
      aria-label="Indietro">
      <i pButtonIcon class="fa fa-chevron-left"></i>
    </button>
    <h1 class="text-lg font-semibold text-surface-900 dark:text-surface-0">Tutti i documenti</h1>
  </div>

  <div class="flex gap-2">
    <button
      type="button"
      class="rounded-full border px-3.5 py-1.5 text-sm font-semibold"
      [class]="
        filtro() === 'tutti'
          ? 'border-transparent bg-primary-100 text-primary-700 dark:bg-primary-400/20 dark:text-primary-300'
          : 'border-surface-200 text-surface-600 dark:border-surface-700 dark:text-surface-300'
      "
      (click)="impostaFiltro('tutti')">
      Tutti
    </button>
    <button
      type="button"
      class="rounded-full border px-3.5 py-1.5 text-sm font-semibold"
      [class]="
        filtro() === 'a4'
          ? 'border-transparent bg-primary-100 text-primary-700 dark:bg-primary-400/20 dark:text-primary-300'
          : 'border-surface-200 text-surface-600 dark:border-surface-700 dark:text-surface-300'
      "
      (click)="impostaFiltro('a4')">
      Riepilogo A4
    </button>
    <button
      type="button"
      class="rounded-full border px-3.5 py-1.5 text-sm font-semibold"
      [class]="
        filtro() === 'busta'
          ? 'border-transparent bg-primary-100 text-primary-700 dark:bg-primary-400/20 dark:text-primary-300'
          : 'border-surface-200 text-surface-600 dark:border-surface-700 dark:text-surface-300'
      "
      (click)="impostaFiltro('busta')">
      Busta
    </button>
  </div>

  <div>
    @for (documento of documentiFiltrati(); track documento.id) {
      <app-document-list-item [documento]="documento" />
    }
  </div>
</div>
